[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microfleet"
version = "0.1.0"
description = "Desktop console for managing Linux microservices over SSH"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
    "paramiko>=3.4,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
microfleet = "microfleet.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

